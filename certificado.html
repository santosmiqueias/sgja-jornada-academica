<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https: http://localhost:3000 http://127.0.0.1:3000; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Meu certificado · 6ª Jornada Acadêmica</title>
  <link rel="icon" href="assets/img/favicon.png?v=202611121041">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>
<body>
  <div id="menu"></div>

  <div class="cabecalho-pagina">
    <div class="container">
      <h1 class="fw-bold mb-1">Meu certificado</h1>
      <p class="mb-0 opacity-75">Consulte sua presença, recupere seu ingresso e baixe o certificado</p>
    </div>
  </div>

  <main class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card p-4 p-md-5">
          <form id="form-consulta" class="row g-3 align-items-end" novalidate>
            <div class="col-md-5">
              <label for="cpf" class="form-label">CPF</label>
              <input type="text" class="form-control form-control-lg" id="cpf" inputmode="numeric" placeholder="000.000.000-00" autocomplete="off" required>
              <div class="invalid-feedback">CPF inválido.</div>
            </div>
            <div class="col-md-7">
              <label for="email" class="form-label">E-mail usado na inscrição</label>
              <input type="email" class="form-control form-control-lg" id="email" inputmode="email" autocomplete="email" maxlength="120" required>
              <div class="invalid-feedback">Informe o e-mail da inscrição.</div>
            </div>
            <div class="col-12 d-grid">
              <button class="btn btn-primary btn-lg" id="btn-consultar"><i class="bi bi-search me-1"></i>Consultar</button>
            </div>
            <p class="small text-muted mb-0">Pedimos o CPF e o e-mail para que só você veja seus dados e seu ingresso.</p>
          </form>
        </div>

        <div id="resultado" class="mt-4" aria-live="polite"></div>
      </div>
    </div>
  </main>

  <div id="rodape"></div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="vendor/qrcode.min.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="vendor/emailjs.min.js"></script>
  <script src="js/config.js?v=202611121041"></script>
  <script src="js/core.js?v=202611121041"></script>
  <script src="js/servico.js?v=202611121041"></script>
  <script src="js/api.js?v=202611121041"></script>
  <script src="js/ui.js?v=202611121041"></script>
  <script src="js/certificado-base64.js?v=202611121041"></script>
  <script src="js/certificado-pdf.js?v=202611121041"></script>
  <script src="js/meu-certificado.js?v=202611121041"></script>
</body>
</html>
